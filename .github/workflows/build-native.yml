name: Build AArch64 Lightpanda

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-linux-aarch64:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install deps
        uses: ./.github/actions/install
        with:
          os: linux
          arch: aarch64

      - name: Show tool versions
        run: |
          zig version
          uname -a

      - name: Build V8 snapshot
        run: zig build -Dprebuilt_v8_path=v8/libc_v8.a -Doptimize=ReleaseFast snapshot_creator -- src/snapshot.bin

      - name: Build (aarch64 linux)
        run: zig build -Dsnapshot_path=../../snapshot.bin -Dprebuilt_v8_path=v8/libc_v8.a -Doptimize=ReleaseFast -Dcpu=generic --verbose

      - name: Locate output
        run: |
          ls -lah zig-out || true
          find zig-out -maxdepth 6 -type f -executable -print

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="zig-out/bin/lightpanda"
          test -n "$BIN"
          test -x "$BIN"
          cp "$BIN" lightpanda-aarch64-linux
          chmod +x lightpanda-aarch64-linux
          tar -czf lightpanda-aarch64-linux.tar.gz lightpanda-aarch64-linux
          sha256sum lightpanda-aarch64-linux > lightpanda-aarch64-linux.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightpanda-aarch64-linux
          path: |
            lightpanda-aarch64-linux
            lightpanda-aarch64-linux.tar.gz
            lightpanda-aarch64-linux.sha256
