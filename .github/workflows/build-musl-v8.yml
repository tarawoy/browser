name: Build Musl V8 Lightpanda

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-aarch64-musl:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install apt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates clang git make python3 rsync unzip wget xz-utils

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/html5ever

      - name: Cache Zig and V8
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            .lp-cache
            ~/.cache/zig
          key: musl-v8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**', '.github/workflows/build-musl-v8.yml') }}
          restore-keys: |
            musl-v8-${{ runner.os }}-${{ runner.arch }}-

      - name: Show tool versions
        run: |
          zig version
          rustc --version
          uname -a

      - name: Build Lightpanda with source-built V8 for musl
        shell: bash
        run: |
          set -o pipefail
          zig build \
            -Doptimize=ReleaseFast \
            -Dtarget=aarch64-linux-musl \
            -Dcpu=generic \
            --verbose 2>&1 | tee build-musl.log

      - name: Locate output
        if: always()
        run: |
          ls -lah zig-out || true
          find zig-out -maxdepth 6 -type f -executable -print || true
          find .lp-cache -path '*libc_v8.a' -print || true

      - name: Package binary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BIN="zig-out/bin/lightpanda"
          test -x "$BIN"
          cp "$BIN" lightpanda-aarch64-linux-musl
          chmod +x lightpanda-aarch64-linux-musl
          tar -czf lightpanda-aarch64-linux-musl.tar.gz lightpanda-aarch64-linux-musl
          sha256sum lightpanda-aarch64-linux-musl > lightpanda-aarch64-linux-musl.sha256

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-musl-logs
          path: |
            build-musl.log

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lightpanda-aarch64-linux-musl
          path: |
            lightpanda-aarch64-linux-musl
            lightpanda-aarch64-linux-musl.tar.gz
            lightpanda-aarch64-linux-musl.sha256
